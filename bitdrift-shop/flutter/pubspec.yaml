name: bitdrift_shop_flutter
description: Flutter port of the Bitdrift Shop demo (alpha capture_flutter, best-effort).
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  # capture_flutter 0.0.4+ requires Flutter 3.44+ / Dart 3.12+ (Built-in Kotlin support).
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Alpha Flutter plugin — pinned to the alpha prototype tag.
  capture_flutter:
    git:
      url: https://github.com/bitdriftlabs/capture-sdk.git
      ref: flutter-prototype-0.0.4
      path: platform/capture_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
