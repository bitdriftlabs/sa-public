  # --- startup / lifecycle -------------------------------------------------------
  - name: app_launched
    level: info
    trigger: startup
    optional: [sdk_started]
    source: {android: "A:ShoppingDemoApp.kt:52", ios: "I:CaptureBridge.swift:83", reactnative: "R:App.tsx:171", flutter: "F:main.dart:27"}
  - name: app_open
    level: info
    trigger: lifecycle
    required: [trigger]
    missing_on: [flutter]
    source: {android: "A:AppLifecycleCallbacks.kt:38", ios: "I:BitdriftShopApp.swift:100", reactnative: "R:src/utils/appLifecycle.ts:43"}
  - name: app_close
    level: info
    trigger: lifecycle
    required: [trigger]
    missing_on: [flutter]
    source: {android: "A:AppLifecycleCallbacks.kt:47", ios: "I:BitdriftShopApp.swift:105", reactnative: "R:src/utils/appLifecycle.ts:45"}
  - name: memory_pressure
    level: warning
    trigger: lifecycle
    required: [level]
    missing_on: [flutter]
    source: {android: "A:AppLifecycleCallbacks.kt:57", ios: "I:BitdriftShopApp.swift:77", reactnative: "R:src/utils/appLifecycle.ts:37"}
  - name: low_memory
