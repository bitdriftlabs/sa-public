# Telemetry: every app-emitted event (log message), field key, global field and span.
#
# Names are what live bd-shop workflows match on (log_body / _span_name / field keys),
# so Android/iOS spellings are frozen unless DECISIONS.md says otherwise.
#
# Per-entry platform semantics (see README.md "Schema"):
#   platforms    platforms that must emit it (default: all four)
#   optional_on  platforms exempt (SDK limitation or feature intentionally absent)
#   missing_on   platforms that should emit it but currently do not (work item, not exempt)
#   drift        {platform: current_value} -- the platform emits a different name today
#                and must be renamed to the spec name (resolved in DECISIONS.md)
#   required / optional   field keys (all must exist in `fields`)

version: 1

source_roots:
  A: android/app/src/main/java/ai/bitdrift/shop
  I: ios/BitdriftShop
  R: reactnative
  F: flutter/lib

platforms: [android, ios, reactnative, flutter]
best_effort_platforms: [kmp]   # wip-kotlin-multiplatform: not validated, see DECISIONS.md D-KMP-1

session_model:
  # D-SES-1: Android wins. New session per process start; sim calls startNewSession()
  # at the start of every journey (skipped while force-quit injection is enabled).
  per_launch: true
  new_session_per_journey: true
  skip_new_session_when: force_quit_enabled
  source: {android: "A:SimulationManager.kt:618", ios: "I:SimulationManager.swift:688"}
  optional_on: [reactnative, flutter]  # RN init uses SessionStrategy.Activity (R:App.tsx:71); Flutter uses activityBased (F:bd/capture.dart:25)

# ─────────────────────────────────────────────────────────────────────────────
# Field registry. Every key used anywhere in this file must be listed here.
# platform_specific: true  => value legitimately differs per platform (excluded from
# cross-platform stream diffs). owner: sdk => written by the Capture SDK, not the app.
# ─────────────────────────────────────────────────────────────────────────────
fields:
  # SDK-owned keys referenced by workflows or emulated by the RN/Flutter span shims
  - {key: _screen_name, owner: sdk}
  - {key: _span_name, owner: sdk}
  - {key: _span_type, owner: sdk, values: [start, end]}
  - {key: _span_id, owner: sdk}
  - {key: _duration_ms, owner: sdk}
  - {key: _result, owner: sdk, values: [success, failure, canceled]}
  - {key: _app_exit_reason, owner: sdk}
  - {key: _frame_issue_type, owner: sdk}
  - {key: parent_span_id, desc: "RN paired-log span shim only (R:src/utils/logger.ts:119)", platforms: [reactnative]}

  # Simulation bookkeeping
  - {key: total_runs}
  - {key: completed_runs}
  - {key: runs_each}
  - {key: run, desc: "1-based journey index"}
  - {key: variant, values: ["Control", "Variant A", "Variant B"], desc: "persona label, see personas.yaml"}
  - {key: entity, desc: "entity id set via setEntityId, from personas.yaml sim_data.entities"}
  - {key: mode, desc: "journey span: 'simplified' (iOS only); *_restart_resume: single|infinite"}
  - {key: pending_flag}
  - {key: trigger_mode, values: [random, forced_infinite]}
  - {key: anr_restart_pending}
  - {key: fq_restart_pending}
  - {key: anr_resume_infinite}
  - {key: fq_resume_infinite}

  # Journey / commerce
  - {key: source, values: [browse, search, categories, featured], desc: "discovery source"}
  - {key: source_screen, desc: "screen/source that triggered add_to_cart / add_to_wishlist"}
  - {key: product_id}
  - {key: items_in_cart}
  - {key: checkout_type, values: [guest, signin]}
  - {key: checkout_session}
  - {key: checkout_flow, values: [random, guest, signin]}
  - {key: payment_method, values: [card, visa, mastercard, amex, apple_pay, paypal, android_pay],
     desc: "card|apple_pay|paypal|android_pay for method-level events and spans; visa|mastercard|amex only on payment_completed from the card screen (D-FLD-2)"}
  - {key: card_last4, values: ["4242", "8888", "1001"]}
  - {key: order_id}
  - {key: original_method}
  - {key: retry_method}
  - {key: payment_retried, values: ["true"]}
  - {key: retried, values: ["true", "false"]}
  - {key: reason, desc: "span end reason (cart_abandoned, checkout_abandoned, ...); Flutter also uses it for error text on *_failed (D-FLD-3)"}
  - {key: rec_v2, values: ["true", "false"]}
  - {key: url}
  - {key: screen_name, desc: "score_products span: Browse|ProductDetail (not the SDK _screen_name)"}

  # Faults
  - {key: force_quit_enabled, values: ["true"]}
  - {key: force_quit_screen}
  - {key: anr_a_enabled, values: ["true"]}
  - {key: journey_type, values: [guest]}
  - {key: anr_screen_name}
  - {key: crash_kind, desc: "platform crash impl key from crashes.yaml (not the logical id)", platform_specific: true}
  - {key: crash_context, values: [foreground, background]}
  - {key: crash_journey_point, values: [cart, checkout, payment, payment_failed, confirmation, simplified_step_5_checkout_guest]}
  - {key: watchdog_event, values: [scene_create, scene_update, process_exit]}
  - {key: block_seconds}
  - {key: hint}

  # Lifecycle
  - {key: trigger, platform_specific: true, desc: "app_open/app_close trigger: onActivityStarted/onActivityStopped (android), scenePhase.active/background (ios), appstate_active/background (rn)"}
  - {key: level, platform_specific: true, desc: "memory_pressure: TRIM level int (android) or 'didReceiveMemoryWarning' (ios, rn)"}
  - {key: sdk_started, platforms: [flutter]}

  # iOS previous-run / screen trail
  - {key: termination_reason}
  - {key: fatal}
  - {key: clean}
  - {key: crashed_on_screen}
  - {key: crashed_on_trail}
  - {key: screen}
  - {key: steps_completed}
  - {key: crash_loop}
  - {key: fast_crash}
  - {key: oom_only}
  - {key: app_hang, desc: "iOS demo_flags_resolved key only; the flag/telemetry name is anr_a (D-FLT-1)"}
  - {key: force_quit}
  - {key: auto_infinite}

  # RN / Flutter app-level HTTP logs
  - {key: method}
  - {key: path}
  - {key: status}
  - {key: duration_ms}
  - {key: error, platforms: [flutter]}

  # Metrics demo
  - {key: metric_sine}
  - {key: metric_square}
  - {key: metric_sawtooth}
  - {key: metric_triangle}
  - {key: metric_dc}
  - {key: metric_counter}
  - {key: metric_work_latency_ms}

  # Global fields (also listed in global_fields below)
  - {key: app_variant, platform_specific: true}
  - {key: platform, values: [android, ios, flutter], platform_specific: true, desc: "RN sends Platform.OS (android|ios)"}
  - {key: user_id}
  - {key: supportlog, values: ["true", "false"]}
  - {key: support, values: ["true"]}
  - {key: sim_app_version, values: ["4.0.0", "4.1.0", "4.2.0", "4.3.0", "4.4.0"]}
  - {key: app_version, platforms: [flutter]}
  - {key: last_screen}
  - {key: screen_current}
  - {key: screen_prev_1}
  - {key: screen_prev_2}
  - {key: screen_prev_3}
  - {key: screen_prev_4}
  - {key: ff_checkout_flow}
  - {key: ff_payment_ui}
  - {key: ff_cart_abandon_rate}
  - {key: ff_payment_android_pay}
  - {key: ff_order_summary}
  - {key: ff_anr_a}
  - {key: ff_force_quit}
  - {key: ff_recommendations_v2}
  - {key: ff_variant}
  - {key: ff_express_checkout}
  - {key: ff_product_card_layout}
  - {key: ff_free_shipping_banner}

# ─────────────────────────────────────────────────────────────────────────────
# Global fields (Logger.addField). ff_* mirrors are defined by flags.yaml (each flag
# with mirror_field) and listed here for codegen; ff_variant is field-only.
# ─────────────────────────────────────────────────────────────────────────────
global_fields:
  - key: app_variant
    values: {android: sdk-demo, ios: sdk-demo, reactnative: sdk-demo, flutter: sdk-demo, kmp: kmp-demo}
    open: OPEN-2   # resolved: iOS unifies on sdk-demo (applied in Phase 2b); see DECISIONS.md
    source: {android: "A:ShoppingDemoApp.kt:57", ios: "I:CaptureBridge.swift:90", reactnative: "R:src/config.ts:25", flutter: "F:main.dart:20"}
  - key: platform
    source: {android: "A:ShoppingDemoApp.kt:62", ios: "I:CaptureBridge.swift:91", reactnative: "R:App.tsx:97", flutter: "F:main.dart:21"}
  - key: user_id
    set_when: "sign-in checkout succeeds; removed on 'new journey' from Confirmation; seeded at startup from persisted user_session.user_id"
    source: {android: "A:Screens.kt:1255", ios: "I:Screens.swift:980"}
    missing_on: [reactnative, flutter]
  - key: supportlog
    set_when: "Advanced screen 'Support Log' toggle"
    source: {android: "A:Screens.kt:542", ios: "I:Screens.swift:256", reactnative: "R:src/context/SimulationContext.tsx:181"}
    optional_on: [flutter]
  - key: support
    set_when: "SupportMode toggle; removed when off (matched by bd-shop-30)"
    platforms: [android]
    source: {android: "A:SupportMode.kt:24"}
  - key: crash_kind
    set_when: "immediately before a crash or watchdog hang fires"
    source: {android: "A:SimulationManager.kt:576", ios: "I:SimulationManager.swift:582", reactnative: "R:src/sim/crashes.ts:198"}
    missing_on: [flutter]   # Flutter logs crash_injection{crash} instead (D-EVT-F12)
  - key: crash_context
    source: {android: "A:SimulationManager.kt:577", ios: "I:SimulationManager.swift:583"}
    missing_on: [reactnative, flutter]
  - key: crash_journey_point
    platforms: [ios]
    open: OPEN-3
    source: {ios: "I:SimulationManager.swift:572"}
  - key: watchdog_event
    platforms: [ios]
    source: {ios: "I:WatchdogHangs.swift:78"}
  - key: last_screen
    platforms: [ios]
    source: {ios: "I:ScreenLogger.swift:51"}
  - key: screen_current
    platforms: [ios]
    source: {ios: "I:ScreenLogger.swift:85"}
  - {key: screen_prev_1, platforms: [ios], source: {ios: "I:ScreenLogger.swift:91"}, source_token: {ios: "screen_prev_"}}
  - {key: screen_prev_2, platforms: [ios], source: {ios: "I:ScreenLogger.swift:91"}, source_token: {ios: "screen_prev_"}}
  - {key: screen_prev_3, platforms: [ios], source: {ios: "I:ScreenLogger.swift:91"}, source_token: {ios: "screen_prev_"}}
  - {key: screen_prev_4, platforms: [ios], source: {ios: "I:ScreenLogger.swift:91"}, source_token: {ios: "screen_prev_"}}
  - key: sim_app_version
    set_when: "metrics demo running; rotates every 30s"
    optional_on: [reactnative, flutter]
    source: {android: "A:MetricsDemo.kt:80", ios: "I:MetricsDemo.swift:86"}
  - key: app_version
    platforms: [flutter]
    source: {flutter: "F:main.dart:22"}
  - {key: ff_checkout_flow, from_flag: checkout_flow}
  - {key: ff_payment_ui, from_flag: payment_ui}
  - {key: ff_cart_abandon_rate, from_flag: cart_abandon_rate}
  - {key: ff_payment_android_pay, from_flag: payment_android_pay}
  - {key: ff_order_summary, from_flag: order_summary}
  - {key: ff_anr_a, from_flag: anr_a}
  - {key: ff_force_quit, from_flag: force_quit}
  - {key: ff_recommendations_v2, from_flag: recommendations_v2}
  - {key: ff_express_checkout, from_flag: express_checkout}
  - {key: ff_product_card_layout, from_flag: product_card_layout}
  - {key: ff_free_shipping_banner, from_flag: free_shipping_banner}
  - key: ff_variant
    desc: "persona label; field only, not a flag exposure"
    source: {android: "A:SimulationManager.kt:110", ios: "I:SimulationManager.swift:133", reactnative: "R:src/sim/variants.ts:165", flutter: "F:sim/simulator.dart:188"}
    source_token: {flutter: "'variant'"}   # Bd.setFlag prefixes ff_ (F:bd/capture.dart:58)

# SDK-emitted events referenced by workflows (not emitted by app code; listed so the
# validator and conformance tool know they are legal).
sdk_events:
  - {name: AppStart, used_by: [android/workflows/bd-shop-13-foreground-session-count.json, android/workflows/bd-shop-15-crash-rate-per-foreground.json]}
  - {name: SceneWillEnterFG, used_by: [android/workflows/bd-shop-13-foreground-session-count.json]}

# ─────────────────────────────────────────────────────────────────────────────
# Events (log messages). trigger: sim | ui | lifecycle | startup | fault | demo | network
# ─────────────────────────────────────────────────────────────────────────────
events:
  # --- simulation lifecycle -------------------------------------------------
  - name: simulation_start
    level: info
    trigger: sim
    required: [total_runs]
    drift_fields: {flutter: "adds variant (D-EVT-F9)"}
    source: {android: "A:ScreenLogger.kt:34", ios: "I:ScreenLogger.swift:158", reactnative: "R:src/utils/logger.ts:195", flutter: "F:sim/simulator.dart:144"}
  - name: simulation_end
    level: info
    trigger: sim
    required: [total_runs]
    drift_fields: {flutter: "adds completed_runs (D-EVT-F9)"}
    source: {android: "A:ScreenLogger.kt:38", ios: "I:ScreenLogger.swift:162", reactnative: "R:src/utils/logger.ts:199", flutter: "F:sim/simulator.dart:170"}
  - name: simulation_cancelled
    level: info
    trigger: sim
    required: [completed_runs, total_runs]
    was: {flutter: journey_stopped}  # conformed in Phase 2b
    drift_level: {reactnative: warning}   # D-EVT-3
    source: {android: "A:SimulationManager.kt:166", ios: "I:SimulationManager.swift:186", reactnative: "R:src/context/SimulationContext.tsx:731", flutter: "F:sim/simulator.dart:164"}
  - name: ab_simulation_start
    level: info
    trigger: sim
    required: [runs_each]
    optional_on: [flutter]
    source: {android: "A:SimulationManager.kt:255", ios: "I:SimulationManager.swift:252", reactnative: "R:src/context/SimulationContext.tsx:682"}
  - name: ab_simulation_end
    level: info
    trigger: sim
    required: [total_runs]
    optional_on: [flutter]
    source: {android: "A:SimulationManager.kt:265", ios: "I:SimulationManager.swift:263", reactnative: "R:src/context/SimulationContext.tsx:699"}
  - name: infinite_simulation_start
    level: info
    trigger: sim
    was: {flutter: simulation_start_infinite}  # conformed in Phase 2b
    source: {android: "A:SimulationManager.kt:299", ios: "I:SimulationManager.swift:286", reactnative: "R:src/context/SimulationContext.tsx:633", flutter: "F:sim/simulator.dart:144"}
  - name: infinite_simulation_end
    level: info
    trigger: sim
    required: [total_runs]
    missing_on: [flutter]
    source: {android: "A:SimulationManager.kt:309", ios: "I:SimulationManager.swift:294", reactnative: "R:src/context/SimulationContext.tsx:648"}
  - name: cardinality_simulation_start
    level: info
    trigger: sim
    optional_on: [flutter]
    source: {android: "A:SimulationManager.kt:335", ios: "I:SimulationManager.swift:311", reactnative: "R:src/context/SimulationContext.tsx:712"}
  - name: cardinality_simulation_end
    level: info
    trigger: sim
    required: [total_runs]
    optional_on: [flutter]
    source: {android: "A:SimulationManager.kt:345", ios: "I:SimulationManager.swift:319", reactnative: "R:src/context/SimulationContext.tsx:723"}
  - name: feature_flag_exposure_set
    level: info
    trigger: sim
    source: {android: "A:SimulationManager.kt:132", ios: "I:SimulationManager.swift:155", reactnative: "R:src/sim/variants.ts:172", flutter: "F:sim/simulator.dart:189"}

  # --- journey ---------------------------------------------------------------
  - name: journey_started
    level: info
    trigger: sim
    required: [run, variant]
    was: {flutter: journey_start}  # conformed in Phase 2b
    drift_fields: {flutter: "sends variant, checkout_type, entity; no run (D-EVT-F1)"}
    source: {android: "A:SimulationManager.kt:621", ios: "I:SimulationManager.swift:690", reactnative: "R:src/context/SimulationContext.tsx:366", flutter: "F:sim/simulator.dart:237"}
  - name: cart_abandoned
    level: info
    trigger: sim
    required: [items_in_cart, variant]
    missing_on: [flutter]
    source: {android: "A:SimulationManager.kt:864", ios: "I:SimulationManager.swift:954", reactnative: "R:src/context/SimulationContext.tsx:505"}
  - name: checkout_abandoned
    level: info
    trigger: sim
    required: [checkout_type, variant]
    missing_on: [flutter]
    source: {android: "A:SimulationManager.kt:921", ios: "I:SimulationManager.swift:1011", reactnative: "R:src/context/SimulationContext.tsx:549"}
  - name: payment_failed
    level: error
    trigger: [sim, ui]
    required: [payment_method]
    optional: [checkout_session, variant, reason]
    notes: >-
      Sim path (injected failure) sends payment_method in {card, apple_pay, paypal, android_pay}
      plus checkout_session and variant. UI path (payment API threw) sends payment_method and
      attaches the exception. Matched by bd-shop-02 (log_body == payment_failed, grouped by
      payment_method).
    drift_values: {reactnative: "sim sends payment_method=visa for card (D-FLD-2)", flutter: "applePay/androidPay camelCase values (D-FLD-1)"}
    source: {android: "A:SimulationManager.kt:1003", ios: "I:SimulationManager.swift:1062", reactnative: "R:src/context/SimulationContext.tsx:568", flutter: "F:sim/simulator.dart:352"}
    source_ui: {android: "A:Screens.kt:1319", ios: "I:Screens.swift:1126", reactnative: "R:src/screens/ShoppingScreens.tsx:854", flutter: "F:ui/screens.dart:631"}
    used_by: [android/workflows/bd-shop-02-payment-errors.json]
  - name: payment_retry
    level: info
    trigger: sim
    required: [original_method, retry_method, variant]
    missing_on: [flutter]
    source: {android: "A:SimulationManager.kt:1050", ios: "I:SimulationManager.swift:1083", reactnative: "R:src/context/SimulationContext.tsx:579"}
  - name: confirmation_reached
    level: info
    trigger: sim
    required: [_screen_name]
    optional: [checkout_flow, payment_retried, retry_method]
    notes: "success path: _screen_name=Confirmation + checkout_flow; retry path: + payment_retried=true, retry_method"
    was: {flutter: order_completed}  # conformed in Phase 2b
    drift_fields: {reactnative: "sends payment_retried=false on success and no checkout_flow (D-EVT-4)"}
    source: {android: "A:SimulationManager.kt:1090", ios: "I:SimulationManager.swift:1140", reactnative: "R:src/context/SimulationContext.tsx:613", flutter: "F:sim/simulator.dart:364"}

  # --- UI (user taps) ----------------------------------------------------------
  - name: add_to_cart
    level: info
    trigger: ui
    required: [product_id, source_screen]
    was: {flutter: add_to_cart_tapped}  # conformed in Phase 2b
    sim_emits: {reactnative: true}   # OPEN-5
    source: {android: "A:Screens.kt:946", ios: "I:Screens.swift:667", reactnative: "R:src/screens/ShoppingScreens.tsx:429", flutter: "F:ui/screens.dart:333"}
  - name: add_to_wishlist
    level: info
    trigger: ui
    required: [product_id, source_screen]
    was: {flutter: wishlist_add_tapped}  # conformed in Phase 2b
    sim_emits: {reactnative: true}
    source: {android: "A:Screens.kt:954", ios: "I:Screens.swift:671", reactnative: "R:src/screens/ShoppingScreens.tsx:437", flutter: "F:ui/screens.dart:345"}
  - name: cart_item_removed
    level: info
    trigger: ui
    required: [product_id]
    missing_on: [flutter]
    sim_emits: {reactnative: true}
    source: {android: "A:Screens.kt:1092", ios: "I:Screens.swift:818", reactnative: "R:src/screens/ShoppingScreens.tsx:533"}
  - name: cart_failed
    level: error
    trigger: ui
    required: [product_id]
    optional: [reason]
    was: {flutter: add_to_cart_failed}  # conformed in Phase 2b
    drift_level: {flutter: warning}
    source: {android: "A:Screens.kt:1025", ios: "I:Screens.swift:799", reactnative: "R:src/screens/ShoppingScreens.tsx:536", flutter: "F:ui/screens.dart:339"}
  - name: checkout_started
    level: info
    trigger: ui
    required: [checkout_type]
    was: {flutter: checkout_created}  # conformed in Phase 2b
    sim_emits: {reactnative: true}
    source: {android: "A:Screens.kt:1113", ios: "I:Screens.swift:772", reactnative: "R:src/screens/ShoppingScreens.tsx:561", flutter: "F:ui/screens.dart:578"}
  - name: checkout_failed
    level: error
    trigger: ui
    required: [checkout_type]
    optional: [reason]
    drift_level: {flutter: "warning in sim path (F:sim/simulator.dart:326)"}
    source: {android: "A:Screens.kt:1195", ios: "I:Screens.swift:912", reactnative: "R:src/screens/ShoppingScreens.tsx:633", flutter: "F:ui/screens.dart:584"}
    used_by: [android/workflows/bd-shop-02-payment-errors.json]
  - name: payment_completed
    level: info
    trigger: ui
    required: [payment_method, order_id]
    optional: [card_last4]
    was: {flutter: payment_succeeded}  # conformed in Phase 2b
    sim_emits: {reactnative: true}
    source: {android: "A:Screens.kt:1345", ios: "I:Screens.swift:1137", reactnative: "R:src/screens/ShoppingScreens.tsx:729", flutter: "F:ui/screens.dart:675"}
  - name: crash_loop_stopped
    level: info
    trigger: ui
    optional_on: [flutter]   # Flutter crash loop is script-driven (F:crash.dart:74)
    source: {android: "A:Screens.kt:168", ios: "I:Screens.swift:79", reactnative: "R:src/context/SimulationContext.tsx:188"}
  - name: support_mode_on
    level: info
    trigger: ui
    platforms: [android]
    source: {android: "A:SupportMode.kt:28"}
