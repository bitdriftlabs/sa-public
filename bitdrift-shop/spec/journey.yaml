# The simulated shopping journey, as data (plan Phase 4).
#
# Every app runs this one graph through a small interpreter (android JourneyEngine.kt,
# ios JourneyEngine.swift, reactnative src/sim/journeyEngine.ts, flutter lib/sim/journey_engine.dart;
# reference: tools/journey/engine.py). tools/codegen resolves every reference below
# (personas.yaml probabilities and constants, faults.yaml, screens, events, spans,
# endpoints) and writes one normalized JSON bundle per app, so the interpreters stay
# small: they never look anything up by name except a journey variable.
# Change a number in personas.yaml or a step here, run tools/codegen/generate.sh, and
# all four apps change behaviour together. tools/journey/golden.json pins the exact
# call sequence per seed; each app's unit tests replay it.
#
# ── Ops ─────────────────────────────────────────────────────────────────────────
# A step is a bare op name (`new_session`) or a map whose first key is the op.
#   new_session                       adapter.startNewSession()
#   exposures                         adapter.applyExposures(persona): flag exposures +
#                                     ff_* fields + feature_flag_exposure_set (platform code)
#   entity                            entity = entities[(run-1) % n]; adapter.setEntity(entity)
#   wait: <ms | constant name>        adapter.delay(ms)
#   nav: <screen id>  args: {..}      adapter.navigate(screen, args) then waits step_delay_ms.
#                                     args are the screens.yaml route params.
#   api: <endpoint id>  args: {..}    adapter.callApi(endpoint, args) -> JSON object or null.
#     save: {var: {path, default}}    path "a" (string) or "a[].b" (list); the default (a
#                                     sim_data name or a literal) is used when the call
#                                     failed or the value is missing/empty.
#   log: <event>  fields: {..}        adapter.log(level, event, fields); level from telemetry.yaml
#   span_start: <span>  parent  fields         explicit span; handle = span name
#   span_end: <span>  result  fields           no-op if that span is not open
#   span: <span>  parent  fields  do: [..]     scoped span: ends `success` when the block
#                                              finishes or the journey stops inside it
#   set: {var: value, ..}
#   pick: <var>  from: <list var | sim_data list | constant list>  exclude: <value>
#   rand_int: <var>  range: <constant name | [min, max]>
#   choose: <weights decision>  into: <var>  branches: {key: [..]}
#   if: {chance, toggle, not_toggle, eq: [var, value], min_len: [list var, n]}  then: [..]  else: [..]
#     chance: <probability decision> | {by: <var>, cases: {value: decision}, default: decision}
#   switch: <var>  cases: {value: [..]}  default: [..]
#   repeat: <range decision>  do: [..]
#   for_each: <list var>  as: <var>  do: [..]      iterates a snapshot
#   list_add: <list var>  value: ..   list_remove_random: <list var>  into: <var>   list_clear: <list var>
#   last: <list var>  into: <var>  default: ..
#   call: <procedure>
#   fault: <faults.yaml id>  log: <event>  fields: {..}
#       Only when the fault's toggle is on: eligible += 1; roll = rng(); forced = infinite
#       && eligible >= force_after_eligible_journeys. On a hit: eligible = 0, set
#       trigger_mode (random | forced_infinite), log, adapter.injectFault(id), stop
#       (outcome "fault"). The adapter persists the restart intent and performs the fault.
#   crash_point: <point>
#       Only when crash_loop is on and no crash fired yet this journey: fires when <point>
#       is this journey's `crash_point`, or is `confirmation` (the fallback, so the sweep
#       never stalls). Sets global field crash_journey_point, calls adapter.fireCrash(),
#       stop (outcome "crash"). Resolves OPEN-3: iOS's random back-half point, everywhere.
#   stop: <outcome>                   end the journey
#
# ── Values ──────────────────────────────────────────────────────────────────────
# "{name}" in a value is a journey variable; a list variable renders as its length.
# Built in: run, sim_seed, persona (id), variant (persona label), entity, crash_point,
# trigger_mode, and flag.<name> for every persona flag in flags.yaml.
#
# ── Randomness (must be bit-identical in every language) ─────────────────────
# journey_seed = (sim_seed * 1000003 + run) mod 2^32, with 0 <= sim_seed < 2^31.
# rng() = mulberry32(journey_seed), a float in [0, 1). Draws happen only at:
#   choose (1), pick (1), rand_int (1), repeat (1), list_remove_random (1),
#   if with `chance` (1, drawn before any other condition is checked), fault (1, when its
#   toggle is on). Nothing else draws. Weighted choice: r * total, walk the weights in
#   declared order. pick/remove: floor(r * n). rand_int: min + floor(r * (max - min + 1)).
# An empty list for pick yields "" (still one draw).

version: 1

# Fields whose value comes from the backend (random samples, generated ids), so
# same-seed streams legitimately differ in them. tools/conformance --diff ignores them.
volatile_fields: [product_id, order_id, checkout_session]

# OPEN-3: where a crash-loop crash may fire (one is drawn per journey while crash_loop is on).
crash_points: [cart, checkout, payment, payment_failed, confirmation]

procedures:
  # Pay with {method}; leaves {order_id}.
  pay:
    - switch: method
      cases:
        card:
          - nav: payment_card
            args: {checkoutSession: "{session}"}
          - api: pay_card
            args: {checkout_session: "{session}", card_last4: "4242"}
            save: {order_id: {path: order_id, default: ""}}
        apple_pay:
          - nav: payment_apple_pay
            args: {checkoutSession: "{session}"}
          - api: pay_apple_pay
            args: {checkout_session: "{session}"}
            save: {order_id: {path: order_id, default: ""}}
        paypal:
          - nav: payment_paypal
            args: {checkoutSession: "{session}"}
          - api: pay_paypal
            args: {checkout_session: "{session}"}
            save: {order_id: {path: order_id, default: ""}}
        android_pay:
          - nav: payment_android_pay
            args: {checkoutSession: "{session}"}
          - api: pay_android_pay
            args: {checkout_session: "{session}"}
            save: {order_id: {path: order_id, default: ""}}

  # Confirmation screen + checkout.confirmation sub-phase.
  confirm:
    - exposures                         # re-assert flag exposure on this session before Confirmation
    - wait: pre_confirmation_settle_ms
    - nav: confirmation
      args: {orderId: "{order_id}"}

  confirmation_fetch:
    - span: checkout.confirmation
      parent: checkout
      do:
        - api: confirmation
          args: {id: "{order_id}"}
    - wait: post_outcome_settle_ms

journey:
  # ── Session prelude (skipped while force-quit is on: those runs stay in the startup
  #    session so workflows from SDK start to app termination match in one session) ──
  - if: {not_toggle: force_quit}
    then:
      - new_session
      - log: journey_started
        fields: {run: "{run}", variant: "{variant}", sim_seed: "{sim_seed}"}
      - wait: session_settle_ms
      - exposures
      - wait: session_settle_ms
  - entity
  - if: {toggle: crash_loop}
    then:
      - pick: crash_point
        from: crash_points

  - span_start: journey
    fields: {variant: "{variant}", entity: "{entity}"}
  - span_start: product_discovery
    parent: journey
    fields: {variant: "{variant}"}

  # ── Step 1: Welcome ──
  - nav: welcome
  - api: welcome

  # ── Step 2: Discovery ──
  - span: discovery_fetch
    parent: product_discovery
    do:
      - choose: discovery_weights
        into: source
        branches:
          browse:
            - nav: browse
            - api: browse
              save: {products: {path: "products[].id", default: fallback_product_id}}
          search:
            - nav: search
            - pick: query
              from: search_terms
            - api: search
              args: {q: "{query}"}
              save: {products: {path: "products[].id", default: fallback_product_id}}
          categories:
            - nav: categories
            - api: categories
              save: {categories: {path: "categories[].name", default: fallback_category}}
            - pick: category
              from: categories
            - nav: category_browse
              args: {category: "{category}"}
            - api: category_products
              args: {category: "{category}"}
              save: {products: {path: "products[].id", default: fallback_product_id}}

  - if: {chance: featured}
    then:
      - nav: featured
      - api: featured
        save: {products: {path: "featured_products[].id", default: fallback_product_id}}
      - set: {source: featured}

  - pick: pid
    from: products

  # ── Step 3: ProductDetail (+ maybe Reviews) ──
  - span: product_view
    parent: product_discovery
    do:
      - nav: product_detail
        args: {source: "{source}", productId: "{pid}"}
      - api: product
        args: {id: "{pid}"}
      # User swipe-kill on an uninteresting product page.
      - fault: force_quit
        log: force_quit_injected
        fields: {force_quit_enabled: "true", force_quit_screen: ProductDetail, variant: "{variant}", trigger_mode: "{trigger_mode}"}
      - if: {chance: reviews}
        then:
          - nav: reviews
            args: {source: "{source}", productId: "{pid}"}
          - api: reviews
            args: {id: "{pid}"}

  - if: {chance: wishlist}
    then:
      - span: wishlist_add
        parent: product_discovery
        do:
          - log: add_to_wishlist                       # OPEN-5: the sim emits the tap events
            fields: {product_id: "{pid}", source_screen: "{source}"}
          - nav: wishlist
            args: {productId: "{pid}"}
          - api: wishlist_add
            args: {product_id: "{pid}"}

  # ── Step 4: Cart ──
  - list_add: cart
    value: "{pid}"
  - log: add_to_cart
    fields: {product_id: "{pid}", source_screen: "{source}"}
  - nav: cart
    args: {productId: "{pid}"}
  - api: cart_add
    args: {product_id: "{pid}", quantity: "1"}
  - span_end: product_discovery                        # discovery ends when the first item is in the cart
    result: success
    fields: {source: "{source}", product_id: "{pid}"}

  - span: cart_assembly
    parent: journey
    do:
      - repeat: extra_cart_items
        do:
          - pick: extra_pid
            from: products
          - list_add: cart
            value: "{extra_pid}"
          - rand_int: qty
            range: extra_item_quantity
          - log: add_to_cart
            fields: {product_id: "{extra_pid}", source_screen: cart}
          - api: cart_add
            args: {product_id: "{extra_pid}", quantity: "{qty}"}
          - wait: step_delay_ms
      - api: cart_get
      - wait: step_delay_ms
      - if: {chance: remove_item, min_len: [cart, 2]}
        then:
          - list_remove_random: cart
            into: removed
          - log: cart_item_removed
            fields: {product_id: "{removed}"}
          - api: cart_delete
            args: {id: "{removed}"}
          - wait: step_delay_ms
      - if: {chance: empty_and_readd}
        then:
          - for_each: cart
            as: item
            do:
              - log: cart_item_removed
                fields: {product_id: "{item}"}
              - api: cart_delete
                args: {id: "{item}"}
              - wait: step_delay_ms
          - list_clear: cart
          - pick: readd_pid
            from: products
          - list_add: cart
            value: "{readd_pid}"
          - log: add_to_cart
            fields: {product_id: "{readd_pid}", source_screen: cart}
          - api: cart_add
            args: {product_id: "{readd_pid}", quantity: "1"}
          - wait: step_delay_ms
      - if: {chance: quantity_flip, min_len: [cart, 1]}
        then:
          - pick: flip_pid
            from: cart
          - api: cart_delete
            args: {id: "{flip_pid}"}
          - wait: step_delay_ms
          - rand_int: qty
            range: flip_quantity
          - api: cart_add
            args: {product_id: "{flip_pid}", quantity: "{qty}"}
          - wait: step_delay_ms
      - api: cart_get
      - wait: step_delay_ms

  - crash_point: cart

  - if: {chance: cart_abandon}
    then:
      - log: cart_abandoned
        fields: {items_in_cart: "{cart}", variant: "{variant}"}
      - wait: post_outcome_settle_ms
      - span_end: journey
        result: canceled
        fields: {reason: cart_abandoned}
      - stop: cart_abandoned

  - last: cart
    into: checkout_pid
    default: "{pid}"

  # ── Step 5: Checkout ── (guest is forced while the ANR toggle is on for Variant A)
  - if: {toggle: anr, eq: [persona, variant_a]}
    then:
      - set: {checkout_type: guest}
    else:
      - if: {chance: guest_checkout}
        then:
          - set: {checkout_type: guest}
        else:
          - set: {checkout_type: signin}
  - log: checkout_started
    fields: {checkout_type: "{checkout_type}"}
  - span_start: checkout
    parent: journey
    fields: {checkout_type: "{checkout_type}"}
  - switch: checkout_type
    cases:
      guest:
        - nav: checkout_guest
          args: {productId: "{checkout_pid}"}
        - api: checkout_guest
          save: {session: {path: checkout_session, default: ""}}
        # A synchronous guest-session validation call that hangs the main thread.
        - if: {eq: [persona, variant_a]}
          then:
            - fault: anr
              log: guest_anr_injected
              fields: {anr_a_enabled: "true", journey_type: guest, anr_screen_name: CheckoutGuest, variant: "{variant}", trigger_mode: "{trigger_mode}"}
      signin:
        - nav: checkout_signin
          args: {productId: "{checkout_pid}"}
        - api: checkout_signin
          save: {session: {path: checkout_session, default: ""}}

  - crash_point: checkout

  - if: {chance: checkout_dropout}
    then:
      - log: checkout_abandoned
        fields: {checkout_type: "{checkout_type}", variant: "{variant}"}
      - wait: post_outcome_settle_ms
      - span_end: checkout
        result: canceled
        fields: {reason: checkout_abandoned}
      - span_end: journey
        result: canceled
        fields: {reason: checkout_abandoned}
      - stop: checkout_abandoned

  # ── Step 6: Payment ──
  - choose: payment_weights
    into: payment_method
  - if: {chance: {by: payment_method, cases: {android_pay: payment_failure_android_pay}, default: payment_failure}}
    then:
      - set: {will_fail: "true"}
    else:
      - set: {will_fail: "false"}
  - set: {method: "{payment_method}"}
  - span: checkout.payment
    parent: checkout
    fields: {retried: "false"}
    do:
      - call: pay

  - crash_point: payment

  - switch: will_fail
    cases:
      "true":
        - log: payment_failed
          fields: {payment_method: "{payment_method}", checkout_session: "{session}", variant: "{variant}"}
        - nav: payment_failed
          args: {paymentMethod: "{payment_method}", checkoutSession: "{session}"}
        - wait: post_outcome_settle_ms
        - crash_point: payment_failed
        - if: {chance: payment_retry}
          then:
            # Retry with one of the other three methods (D-JRN-2); the retry always succeeds.
            - pick: retry_method
              from: retry_methods
              exclude: "{payment_method}"
            - set: {method: "{retry_method}"}
            - span: checkout.payment
              parent: checkout
              fields: {retried: "true"}
              do:
                - call: pay
            - log: payment_retry
              fields: {original_method: "{payment_method}", retry_method: "{retry_method}", variant: "{variant}"}
            - log: payment_completed
              fields: {payment_method: "{retry_method}", order_id: "{order_id}"}
            - call: confirm
            - log: confirmation_reached
              fields: {_screen_name: Confirmation, payment_retried: "true", retry_method: "{retry_method}"}
            - call: confirmation_fetch
            - span_end: checkout
              result: success
              fields: {payment_method: "{retry_method}", retried: "true"}
            - span_end: journey
              result: success
            - crash_point: confirmation
            - stop: completed
          else:
            # The customer gives up after the failed payment (OPEN-4).
            - span_end: checkout
              result: failure
              fields: {payment_method: "{payment_method}"}
            - span_end: journey
              result: failure
              fields: {reason: payment_failed}
            - stop: payment_failed

  # ── Step 7: Confirmation ──
  - log: payment_completed
    fields: {payment_method: "{payment_method}", order_id: "{order_id}"}
  - call: confirm
  - log: confirmation_reached
    fields: {_screen_name: Confirmation, checkout_flow: "{flag.checkout_flow}"}
  - call: confirmation_fetch
  - span_end: checkout
    result: success
    fields: {payment_method: "{payment_method}"}
  - span_end: journey
    result: success
  - crash_point: confirmation
  - stop: completed

# Canned backend responses for the interpreter unit tests (tools/journey/golden.json).
# Not bundled into the apps.
test_fixture:
  welcome: {store_name: bitdrift shop}
  browse: {products: [{id: b1}, {id: b2}, {id: b3}, {id: b4}, {id: b5}, {id: b6}, {id: b7}, {id: b8}]}
  search: {products: [{id: s1}, {id: s2}, {id: s3}]}
  featured: {featured_products: [{id: f1}, {id: f2}, {id: f3}, {id: f4}, {id: f5}, {id: f6}]}
  categories: {categories: [{name: Electronics}, {name: Clothing}, {name: "Home & Garden"}, {name: Sports}]}
  category_products: {products: [{id: c1}, {id: c2}]}
  checkout_guest: {checkout_session: cs_guest}
  checkout_signin: {checkout_session: cs_signin}
  pay_card: {order_id: ord_card}
  pay_apple_pay: {order_id: ord_apple}
  pay_paypal: {order_id: ord_paypal}
  pay_android_pay: {order_id: ord_android}
  # endpoints not listed return {}; "reviews" fails (null) to exercise the error path
  fail: [reviews]
