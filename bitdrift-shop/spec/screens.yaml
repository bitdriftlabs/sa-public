# Screens: the single list of navigation destinations.
#
# `name` is the value passed to logScreenView (the SDK-owned `_screen_name` field).
# Live workflows match on it (android/workflows/bd-shop-01, ios/workflows/bd-shop-17/19),
# so Android/iOS values are frozen. `route` is the Android/iOS navigation route template
# (byte-identical on both). RN uses the screen name as its route; Flutter uses its own
# route keys (platform_routes) -- routes are not telemetry.
#
# Source refs: "<root>:<path>:<line>"; roots are defined in source_roots (see README.md).

version: 1

source_roots:
  A: android/app/src/main/java/ai/bitdrift/shop
  I: ios/BitdriftShop
  R: reactnative
  F: flutter/lib

screens:
  - id: welcome
    name: Welcome
    route: welcome
    step: 1
    load_span: welcome_screen_load
    platform_routes: {reactnative: Welcome, flutter: "/"}
    source: {android: "A:Screen.kt:19", ios: "I:Screen.swift:73", reactnative: "R:src/screens/ShoppingScreens.tsx:94", flutter: "F:ui/welcome.dart:32"}

  - id: advanced
    name: Advanced
    route: advanced
    step: 1
    platform_routes: {reactnative: Advanced, flutter: diagnostics}
    drift: {flutter: Diagnostics}          # D-SCR-2: Flutter renames Diagnostics -> Advanced
    source: {android: "A:Screen.kt:20", ios: "I:Screen.swift:74", reactnative: "R:src/screens/ShoppingScreens.tsx:944", flutter: "F:ui/screens.dart:790"}

  - id: browse
    name: Browse
    route: browse
    step: 2
    load_span: browse_screen_load
    platform_routes: {reactnative: Browse, flutter: browse}
    source: {android: "A:Screen.kt:31", ios: "I:Screen.swift:75", reactnative: "R:src/screens/ShoppingScreens.tsx:189", flutter: "F:ui/screens.dart:40"}

  - id: search
    name: Search
    route: search
    step: 2
    platform_routes: {reactnative: Search, flutter: search}
    source: {android: "A:Screen.kt:24", ios: "I:Screen.swift:76", reactnative: "R:src/screens/ShoppingScreens.tsx:221", flutter: "F:ui/screens.dart:140"}

  - id: featured
