    step: 3
    platform_routes: {reactnative: Featured, flutter: featured}
    source: {android: "A:Screen.kt:31", ios: "I:Screen.swift:77", reactnative: "R:src/screens/ShoppingScreens.tsx:254", flutter: "F:ui/screens.dart:51"}

  - id: categories
