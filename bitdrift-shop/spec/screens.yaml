    route: categories
    step: 3
    platform_routes: {reactnative: Categories, flutter: categories}
    source: {android: "A:Screen.kt:31", ios: "I:Screen.swift:78", reactnative: "R:src/screens/ShoppingScreens.tsx:294", flutter: "F:ui/screens.dart:80"}

  - id: category_browse
    name: CategoryBrowse
    route: "categoryBrowse/{category}"
    step: 3
    platform_routes: {reactnative: CategoryBrowse, flutter: category}
    source: {android: "A:Screen.kt:29", ios: "I:Screen.swift:9", reactnative: "R:src/screens/ShoppingScreens.tsx:333", flutter: "F:ui/screens.dart:117"}
    route_source: "A:Screen.kt:55"

  - id: product_detail
    name: ProductDetail
    route: "productDetail/{source}/{productId}"
    step: 4
    load_span: product_detail_load
